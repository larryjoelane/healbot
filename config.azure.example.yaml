# Copy to config.yaml for a real subscription.
# Credentials come from DefaultAzureCredential (managed identity in Azure,
# Azure CLI locally). Do not put secrets in this file.

server:
  addr: ":43117"
  webhook_token: ""   # set HEALBOT_WEBHOOK_TOKEN; empty rejects ingest in azure mode
  admin_token: ""     # set HEALBOT_ADMIN_TOKEN; empty rejects control actions in azure mode

mode: azure
dry_run: true         # ceiling. Set false only after a resource also opts in.

azure:
  subscription_id: "" # or HEALBOT_SUBSCRIPTION_ID
  workspace_id: ""    # Log Analytics workspace GUID, optional

audit:
  path: /var/lib/healbot/audit.jsonl
  sync: false
  max_memory: 5000

safety:
  cooldown: 10m
  max_per_hour: 3
  breaker_failures: 2
  breaker_open_for: 30m

escalation:
  deploy_window: 2h
  notify_counts: [1, 10, 50, 100]

resources: []
  # - id: /subscriptions/.../providers/Microsoft.Web/sites/api
  #   max_tier: 2
  #   dry_run: false
  #   allowed_actions: [restart, slot_swap]
  #   known_good_slot: staging
  #   health_url: https://api.example.com/health
  #   max_instances: 5
  #   fix_mode: template   # optional override: template | model_patch | issue

notify:
  stdout: true
  webhooks:
    - name: teams
      url: ""          # incoming webhook
      format: teams    # teams | slack | json

llm:
  provider: heuristic # azure_openai
  endpoint: ""        # AZURE_OPENAI_ENDPOINT
  deployment: ""      # AZURE_OPENAI_DEPLOYMENT
  api_version: "2024-10-21"

repo:
  provider: github    # mock | github | azure_devops
  github:
    owner: ""
    repo: ""
    token_env: GITHUB_TOKEN

# Tier 3. template does not call a model and does not assign an agent.
# model_patch reuses llm.endpoint with managed identity unless api_key_env is set.
# issue assigns the Copilot coding agent, or mentions @claude when issue.agent is claude.
# See docs/fix.md for token permissions. Do not put the token in this file.
fix:
  mode: template
  wait_for_ci: false
  # allow_paths: ["src/**", "tests/**"]
  # allow_denied_paths: []   # exceptions to the CI, secret, infra, and lockfile denylist
  issue:
    agent: copilot       # copilot | claude | none
    assignee: copilot-swe-agent[bot]
    mention: "@claude"
    # custom_agent: incident-fix
    # labels: ["claude"]

poller:
  enabled: false
  every: 1m
  lookback: 15m
  kql: |
    exceptions
    | where timestamp > ago(15m)
    | extend ResourceId = tostring(customDimensions["ResourceId"])
    | project timestamp, problemId, outerMessage, operation_Name, ResourceId, details
    | take 200
